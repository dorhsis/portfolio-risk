[project]
name = "portfolio-risk"
version = "0.1.0"
description = "Risk analytics for US stock portfolios: concentration, risk contribution, correlations, factor exposure, stress tests"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "numpy>=2.0",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "yfinance>=0.2.50",
]

[project.scripts]
portfolio-risk = "portfolio_risk.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=1.13",
    "pandas-stubs>=2.2",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-requests>=2.32",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portfolio_risk"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]

[tool.mypy]
strict = true
files = ["src", "app.py"]

[[tool.mypy.overrides]]
module = ["yfinance.*"]
ignore_missing_imports = true
